# Actualizaciones automáticas de dependencias (docs/security-checklist.md, punto 8).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
      menores:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
